name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: typecheck + build (clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile fails fast if package.json drifted from
      # pnpm-lock.yaml without a lockfile bump — the same failure mode
      # `npm ci` catches in the sutando server repo.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Bundles to ./dist. Vite type-checks the import graph as a side
      # effect of bundling, so this also catches missing exports across
      # files that `tsc --noEmit` alone wouldn't see.
      - name: Build
        run: pnpm build
